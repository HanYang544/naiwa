name: 检查项目文件

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查 PowerShell 语法
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\naiwa-pet.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }

      - name: 检查动画帧数量
        shell: powershell
        run: |
          $daily = (Get-ChildItem '.\assets\animation_detailed' -File -Filter '*.png').Count
          $funny = (Get-ChildItem '.\assets\funny_detailed' -File -Filter '*.png').Count
          if ($daily -ne 60) { throw "Expected 60 daily frames; found $daily" }
          if ($funny -ne 96) { throw "Expected 96 funny frames; found $funny" }
          Write-Host "Animation frames verified: $($daily + $funny)"

